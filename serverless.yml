service: stridecal-investment-analysis

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs16.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 30
  environment:
    NODE_ENV: production
  
  # IAM permissions
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

plugins:
  - serverless-offline

functions:
  app:
    handler: lambda/app.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

package:
  patterns:
    - '!node_modules/**'
    - '!venv/**'
    - '!src/**'
    - '!.git/**'
    - '!*.md'
    - '!test-setup.sh'
    - '!deploy-lambda.sh'
    - 'lambda/**'
    - 'dist/**'
    - 'package.json'
